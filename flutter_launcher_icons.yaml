flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon_master.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/images/adaptive_bg.png"
  adaptive_icon_foreground: "assets/images/adaptive_fg.png"
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/images/app_icon_master.png"
    background_color: "#058c97"
    theme_color: "#058c97"
  windows:
    generate: true
    image_path: "assets/images/app_icon_master.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon_master.png"
